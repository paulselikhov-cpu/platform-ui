<!-- jump-to-unread-button.html -->
<button class="jump-fab" (click)="jump.emit()">
  <svg class="jump-fab-chevron" viewBox="0 0 24 24" fill="none">
    <path
      d="M6 9l6 6 6-6"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  @if (count() > 0) {
    <span class="jump-fab-badge">{{ count() > 99 ? "99+" : count() }}</span>
  }
</button>
