<div class="selection-toolbar">
  <span class="selection-toolbar__count">
    Выделено: {{ selectionService.selectedCount() }}
  </span>

  <div class="selection-toolbar__actions">
    <default-button
      label="Копировать"
      type="primary"
      size="xs"
      [disabled]="selectionService.selectedCount() === 0"
      (click)="onCopy()"
    ></default-button>  
    @if (isEveryCurrentUserMessages() || location().memberRole === "OWNER") {
      <default-button
        label="Удалить"
        size="xs"
        type="danger"
        [disabled]="selectionService.selectedCount() === 0"
        (click)="onDelete()"
      ></default-button>
    }
    <default-button label="Отмена" size="xs" (click)="onCancel()"></default-button>
  </div>
</div>
