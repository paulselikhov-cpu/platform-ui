<table>
    <tr>
        <td><button (click)="openModalPassportApplication()" class="btn-primary">{{APPLICATION_TYPE_LABELS.REGISTER_PASSPORT}}</button></td>
        <td><button (click)="openModalWorkLicenceApplication()" class="btn-primary">{{APPLICATION_TYPE_LABELS.REGISTER_WORK_LICENCE}}</button></td>
        <td><button (click)="openModalWorkMenu()" class="btn-primary">Биржа труда</button></td>
    </tr>
</table>

<!-- форма подтверждения Заявки на получение паспорта -->
@if (isOpenModalPassportApplication()) {
    <app-confirm-modal [config]="passportApplicationModalConfig" [loading]="passportApplicationLoading()" (confirmed)="confirmPassportApplication()"
        (cancelled)="cancelModalPassportApplication()" />
}

<!-- форма подтверждения Заявки на получение регистрации для работы -->
@if (isOpenModalWorkLicenceApplication()) {
    <app-confirm-modal [config]="passportApplicationModalConfig" [loading]="workLicenceApplicationLoading()"
        (confirmed)="confirmWorkLicenceApplication()" (cancelled)="cancelModalWorkLicenceApplication()" />
}
