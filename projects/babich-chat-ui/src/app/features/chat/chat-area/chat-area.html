<div class="chat-area">
  <!-- лента сообщений -->
  <app-chat-area-messages
    [room]="room()"
    [locationId]="location().id"
    [onlineIds]="onlineIds()"
  />

  <!-- панель выделения — заменяет message-input в режиме выделения -->
  @if (selectionService.selectionMode()) {
    <app-selection-toolbar
      [location]="location()"
      [allMessages]="getAllMessages()"
      (copySelected)="onCopySelected($event)"
      (deleteSelected)="onDeleteSelected($event)"
    />
  } @else {
    <app-message-input
      [roomName]="room().name"
      [roomId]="room().id"
      [replyTo]="messagesService.replyTo()"
      (send)="sendMessage($event)"
      (sendFile)="sendFile($event)"
      (sendVoice)="sendVoice($event)"
      (cancelReply)="cancelReply()"
    />
  }
</div>
