<div class="chat-area">

    <!-- header комнаты -->
    <div class="chat-header">
        <span class="chat-room-icon">#</span>
        <span class="chat-room-name">{{ room().name }}</span>
        @if (room().description) {
        <span class="chat-room-desc">{{ room().description }}</span>
        }
    </div>

    <!-- сообщения — пока заглушка -->
    <div class="chat-messages">
        <div class="chat-placeholder">
            <p>Добро пожаловать в <strong>#{{ room().name }}</strong></p>
            <p>Здесь начнётся история этой комнаты</p>
        </div>
    </div>

    <!-- поле ввода -->
    <app-message-input [roomName]="room().name" />

</div>
