<div class="room-list">
  <!-- Кнопка «Главная» — возврат в главное меню локации. Сверху списка комнат,
       отделённая линией, чтобы не путалась с комнатами. -->
  <button type="button" class="room-home-item" [class.active]="activeHome()" title="Главная (меню локации)" (click)="homeSelected.emit()">
    <span class="room-home-item__icon">🏠</span>
    <span class="room-home-item__label">Главная</span>
  </button>
  <div class="room-list__divider"></div>
  @for (room of rooms(); track room.id) {
    <div
      class="room-item"
      [class.active]="selectedRoom()?.id === room.id"
      (click)="roomSelected.emit(room)"
    >
      <span class="room-icon">#</span>
      <div class="room-info">
        <span class="room-name">{{ room.name }}</span>
        @if (room.description) {
          <span class="room-desc">{{ room.description }}</span>
        }
      </div>
      @if (unreadFor(room.id) > 0) {
        <app-unread-badge [count]="unreadFor(room.id)" />
      }
    </div>
  }
</div>
