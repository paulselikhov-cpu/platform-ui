<div class="location-view">
    <section class="location-chat">
        @if (selectedRoom()) {
        <app-chat-area
            [room]="selectedRoom()!"
            [location]="location()"
            [onlineIds]="onlineIds()"
            [onlineState]="onlineState()"
            [rooms]="rooms()"
        />
        } @else {
        <div class="room-empty">
            <span>Выберите комнату</span>
            <span class="room-empty-hint">Выберите комнату в боковой панели слева</span>
        </div>
        }
    </section>
</div>
