<div class="location-view">

    <!-- список комнат -->
    <aside class="location-rooms">
        <div class="location-header">
            <h3 class="location-name">{{ location().name }}</h3>
            <span class="location-badge">
                {{ location().isPublic ? 'Публичная' : 'Приватная' }}
            </span>
        </div>

        @if (loading()) {
        <div class="rooms-loading">Загрузка комнат...</div>
        } @else {
        <app-room-list [rooms]="rooms()" [selectedRoom]="selectedRoom()" (roomSelected)="onRoomSelected($event)" />
        }
    </aside>

    <!-- область чата -->
    <section class="location-chat">
        @if (selectedRoom()) {
        <app-chat-area [room]="selectedRoom()!" />
        } @else {
        <div class="room-empty">Выберите комнату</div>
        }
    </section>

</div>
