<div class="room-view">
    <!-- шапка комнаты: имя, «печатает…», меню «⚡ Действия»; меню присутствия
         локации передаётся контентом (шапка о нём не знает) -->
    <app-location-header
        icon="#"
        [title]="selectedRoom().name"
        [subtitle]="selectedRoom().description || null"
        [typingText]="typingText()"
        [menuItems]="menuItems()"
        [statusText]="statusText()"
        [statusOnline]="connected()"
    >
        <app-location-users-menu
            [locationId]="location().id"
            [rooms]="rooms()"
            [onlineState]="onlineState()"
        />
    </app-location-header>



    @if (showTabBar()) {
        <default-tabs-set
            [tabs]="allTabs()"
            [activeTab]="activeTab()"
            [size]="size()"
            ariaLabel="Вкладки комнаты"
            (activeTabChange)="activeTab.set($event)"
        />

        <div class="room-tab-content">
            @if (activeTab() === 'chat') {
                <section class="room-main">
                    <app-chat-area [room]="selectedRoom()" [location]="location()" [onlineIds]="onlineIds()" />
                </section>
            } @else if (activeTabComponent()) {
                <ng-container
                    *ngComponentOutlet="activeTabComponent(); inputs: { roomId: selectedRoom().id, locationId: location().id, characterId: characterId() }"
                />
            }
        </div>
    } @else {
        <section class="room-main">
            <app-chat-area [room]="selectedRoom()" [location]="location()" [onlineIds]="onlineIds()" />
        </section>
    }
</div>
