<div class="products-panel">
  <div class="products-header">
    <h3>Продукты</h3>
    <default-tabs-set
      class="products-filter"
      [tabs]="foodTypeTabs()"
      [activeTab]="selectedFoodType()"
      [isGap]="true"
      ariaLabel="Категории продуктов"
      (activeTabChange)="onFilter($event)"
    />
    <default-select
      class="products-mobile-filter"
      [options]="foodTypeOptions()"
      [value]="selectedFoodType()"
      ariaLabel="Категория продуктов"
      (valueChange)="onFilter($event.toString())"
    />
  </div>

  <div class="products-grid">
    @for (good of goods(); track good.itemId) {
      <app-shop-product-card
        [good]="good"
        (addToCart)="onAddToCart($event)"
        (removeFromCart)="onRemoveFromCart($event)"
      />
    }
  </div>

  @if (goods().length === 0) {
    <div class="products-empty">Товары не найдены</div>
  }
</div>
