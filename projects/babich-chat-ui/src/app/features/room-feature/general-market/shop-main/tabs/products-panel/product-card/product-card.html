<default-card
  class="product-card"
  [image]="good().image"
  [title]="good().name"
  [body]="'⚡ +' + good().energy + ' энергии'"
  [description]="(good().price | currency:'₽') + ' · Остаток: ' + good().stock"
  [muted]="!products.isAvailable(good())"
  [showButtons]="true"
>
  <div card-buttons class="product-actions">
    @if (inCart()) {
      <div class="product-cart-qty">
        <default-button label="−" type="primary" size="xs" [fullWidth]="false" (click)="onQtyMinus()"></default-button>
        <span class="product-qty">{{ cartQty() }}</span>
        <default-button label="+" type="primary" size="xs" [fullWidth]="false" (click)="onQtyPlus()" [disabled]="!canIncrement()"></default-button>
      </div>
    }
    @if (!inCart()) {
      <default-button label="В корзину" type="success" size="xs" (click)="onAdd()" [disabled]="!products.isAvailable(good())"></default-button>
    }
  </div>
</default-card>
