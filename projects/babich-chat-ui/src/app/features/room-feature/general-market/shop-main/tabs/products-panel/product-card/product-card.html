<div class="product-card" [class.out-of-stock]="!products.isAvailable(good())">
  <div class="product-image">{{ good().image }}</div>
  <div class="product-info">
    <div class="product-name">{{ good().name }}</div>
    <div class="product-energy">⚡ +{{ good().energy }} энергии</div>
    <div class="product-price">{{ good().price | currency:'₽' }}</div>
    <div class="product-stock" [class.low]="good().stock <= 3">
      Остаток: {{ good().stock }}
    </div>
  </div>
  <div class="product-actions">
    @if (inCart()) {
      <div class="product-cart-qty">
        <default-button label="−" type="primary" size="xs" (click)="onQtyMinus()" [disabled]="!products.isAvailable(good())"></default-button>
        <span class="product-qty">{{ cartQty() }}</span>
        <default-button label="+" type="primary" size="xs" (click)="onQtyPlus()" [disabled]="!products.isAvailable(good())"></default-button>
      </div>
    }
    @if (!inCart()) {
      <default-button label="В корзину" type="success" size="xs" (click)="onAdd()" [disabled]="!products.isAvailable(good())"></default-button>
    }
  </div>
</div>
