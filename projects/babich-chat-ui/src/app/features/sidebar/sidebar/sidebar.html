<div class="sidebar">
    <div class="sidebar-header">
        <h2 class="sidebar-title">Локации</h2>
    </div>

    <div class="sidebar-search">
        <input class="sidebar-search-input" type="text" placeholder="Поиск в моих локациях..." />
    </div>

    <div class="sidebar-list">
        @if (loading()) {
        <div class="sidebar-loading">Загрузка...</div>
        }

        @for (location of locations(); track location.id) {
        <app-location-item [location]="location" [isActive]="selectedId() === location.id"
            (click)="selectLocation(location)" (contextAction)="onContextAction($event)" />
        }

        @if (!loading() && locations().length === 0) {
        <div class="sidebar-empty">
            <p>Нет локаций</p>
            <p>Создайте или найдите!</p>
        </div>
        }
    </div>

    <div class="sidebar-footer">
        <button class="sidebar-create-btn" (click)="createLocation.emit()">
            + Создать локацию
        </button>
        <button class="sidebar-find-btn" (click)="findLocation.emit()">
            🔍 Найти локацию
        </button>
    </div>

    <!-- модальное окно подтверждения -->
    @if (showModal() && modalLocation()) {
        <app-confirm-modal [config]="modalConfig" [loading]="actionLoading()" (confirmed)="confirmAction()"
            (cancelled)="cancelAction()" />
    }
</div>
