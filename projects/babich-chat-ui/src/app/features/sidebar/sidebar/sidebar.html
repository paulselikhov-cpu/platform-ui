<div class="sidebar">

    <!-- header сайдбара -->
    <div class="sidebar-header">
        <h2 class="sidebar-title">Локации</h2>
        <button class="sidebar-btn-join" title="Присоединиться">+</button>
    </div>

    <!-- поиск -->
    <div class="sidebar-search">
        <input class="sidebar-search-input" type="text" placeholder="Поиск локаций..." />
    </div>

    <!-- список локаций -->
    <div class="sidebar-list">

        @if (loading()) {
        <div class="sidebar-loading">Загрузка...</div>
        }

        @for (location of locations(); track location.id) {
        <app-location-item [location]="location" [isActive]="selectedId() === location.id"
            (click)="selectLocation(location)" />
        }

        @if (!loading() && locations().length === 0) {
        <div class="sidebar-empty">
            <p>Нет доступных локаций</p>
            <p>Создайте первую!</p>
        </div>
        }

    </div>

    <!-- footer сайдбара -->
    <div class="sidebar-footer">
        <button class="sidebar-create-btn" (click)="createLocation.emit()">
            + Создать локацию
        </button>
    </div>

</div>
