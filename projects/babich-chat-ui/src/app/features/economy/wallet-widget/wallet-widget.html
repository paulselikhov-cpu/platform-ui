<div class="wallet-widget">
  <div class="wallet-item wallet-coins">
    <span class="wallet-icon">💰</span>
    <span class="wallet-value">{{ coinBalance() }}</span>
  </div>
  
  <div class="wallet-item wallet-energy">
    <span class="wallet-icon">⚡</span>
    <span class="wallet-value">{{ energy() }}</span>
  </div>
  
  <div class="wallet-item wallet-xp">
    <span class="wallet-icon">⭐</span>
    <span class="wallet-value">{{ xp() }}</span>
  </div>
</div>
