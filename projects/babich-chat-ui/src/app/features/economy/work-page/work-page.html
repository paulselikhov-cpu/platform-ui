<div class="work-page">
    @if (!useMobileHeader()) {
    <div class="work-header">
        <app-back-button (back)="cancelled.emit()"></app-back-button>
        <h2 class="work-title">Работа</h2>
    </div>
    }

    <div class="work-content">
        <default-card
            class="work-job-card"
            image="🧹"
            title="Дворник"
            body="Убирай улицы, зарабатывай монеты и опыт"
        />

        <app-default-list class="work-stats-row" layout="grid-compact">
            <default-stat-card label="Монеты" [value]="user()?.coinBalance ?? 0" variant="warning" />
            <default-stat-card label="Энергия">
                <span stat-content>{{ user()?.energy ?? 0 }}/100</span>
            </default-stat-card>
            <default-stat-card label="Опыт" [value]="user()?.xpUser ?? 0" variant="accent" />
        </app-default-list>

        @if (lastResult()) {
            <div class="work-result">
                <span class="work-result-icon">✓</span>
                <span>+{{ lastResult()!.coinsEarned }} 🪙, +{{ lastResult()!.xpEarned }} ⭐</span>
            </div>
        }

        <default-button
            type="primary"
            label="Подметать улицу"
            [disabled]="isWorking() || (user()?.energy ?? 0) < 5"
            (click)="work()"
        ></default-button>

        @if (errorMessage()) {
            <div class="work-error">{{ errorMessage() }}</div>
        }

        @if ((user()?.energy ?? 0) < 5) {
            <p class="work-hint">Недостаточно энергии. Подожди восстановления.</p>
        }
    </div>
</div>
