<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <span class="auth-logo-icon">🏠</span>
            <h1 class="auth-title">BabichChat</h1>
            <p class="auth-subtitle">Ролевой мессенджер</p>
        </div>

        <form class="auth-form">

            @if (error()) {
            <div class="auth-error">{{ error() }}</div>
            }

            <div class="form-field">
                <label class="form-label">Имя пользователя</label>
                <app-default-input
                    type="text"
                    placeholder="username"
                    autocomplete="username"
                    [value]="username()"
                    (valueChange)="username.set($event.toString())"
                />
            </div>

            <div class="form-field">
                <label class="form-label">Пароль</label>
                <app-default-input
                    type="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    [value]="password()"
                    (valueChange)="password.set($event.toString())"
                />
            </div>

            <default-button [label]="loading() ? 'Вход...' : 'Войти'" (click)="onSubmit()" [disabled]="loading()"></default-button>

        </form>

        <p class="auth-link">
            Нет аккаунта?
            <a routerLink="/register">Зарегистрироваться</a>
        </p>

    </div>
</div>
