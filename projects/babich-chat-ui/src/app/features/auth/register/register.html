<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="auth-logo-icon">🏠</span>
            <h1 class="auth-title">BabichChat</h1>
            <p class="auth-subtitle">Создать аккаунт</p>
        </div>
        <form class="auth-form">
            @if (error()) {
                <div class="auth-error">{{ error() }}</div>
            }
            <div class="form-field">
                <label class="form-label">Имя пользователя</label>
                <app-default-input
                    type="text"
                    placeholder="username"
                    autocomplete="username"
                    [value]="username()"
                    (valueChange)="username.set($event.toString())"
                />
            </div>
            <div class="form-field">
                <label class="form-label">Email</label>
                <app-default-input
                    type="email"
                    placeholder="email@example.com"
                    autocomplete="email"
                    [value]="email()"
                    (valueChange)="email.set($event.toString())"
                />
            </div>
            <div class="form-field">
                <label class="form-label">Пароль</label>
                <app-default-input
                    type="password"
                    placeholder="минимум 6 символов"
                    autocomplete="new-password"
                    [value]="password()"
                    (valueChange)="password.set($event.toString())"
                />
            </div>
            <default-button class="auth-btn" type="primary" label="{{ loading() ? 'Регистрация...' : 'Создать аккаунт' }}" (click)="onSubmit()" [disabled]="loading()"></default-button>
        </form>

        <p class="auth-link">
            Уже есть аккаунт? <a routerLink="/login">Войти</a>
        </p>
    </div>
</div>
