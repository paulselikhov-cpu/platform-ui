<default-tabs-set
  class="segments"
  [tabs]="tabs"
  [activeTab]="segment()"
  ariaLabel="Разделы района"
  (activeTabChange)="onSegmentChange($event)"
/>

<div class="district-tab__body">
  @switch (segment()) {
    @case ('news') {
      <app-district-news-feed />
    }
    @case ('notifications') {
      <app-my-notifications-menu />
    }
    @case ('info') {
      <app-district-info-menu />
    }
  }
</div>
