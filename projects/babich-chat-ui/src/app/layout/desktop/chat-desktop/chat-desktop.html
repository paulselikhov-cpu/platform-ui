<div class="desktop-layout">
  <aside class="desktop-sidebar">
    <app-sidebar (locationSelected)="onLocationSelected($event)" (createLocation)="onCreateLocation()" />
  </aside>

  <main class="desktop-content">
    @if (showCreateLocation()) {
    <app-create-location (locationCreated)="onLocationCreated($event)" (cancelled)="onCreateCancelled()" />
    } @else if (selectedLocation()) {
    <app-location-view [location]="selectedLocation()!" />
    } @else {
    <app-location-empty />
    }
  </main>
</div>
