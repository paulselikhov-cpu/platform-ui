<div class="emoji-panel">

    <!-- поиск -->
    <div class="emoji-panel__search">
        <input class="emoji-panel__search-input" type="text" placeholder="Поиск смайликов..." [value]="searchQuery()"
            (input)="searchQuery.set($any($event.target).value)" />
    </div>

    <!-- вкладки категорий -->
    <div class="emoji-panel__tabs">
        @for (cat of visibleCategories; track cat.id) {
        <button class="emoji-panel__tab" [class.emoji-panel__tab--active]="activeCategory() === cat.id"
            [title]="cat.label" (click)="setCategory(cat.id)">
            {{ cat.icon }}
        </button>
        }
    </div>

    <!-- сетка смайликов -->
    <div class="emoji-panel__grid">
        @if (searchQuery().trim() && searchResults().length === 0) {
        <div class="emoji-panel__empty">Смайлики не найдены</div>
        }

        @for (emoji of activeEmojis; track emoji.file) {
        <button class="emoji-panel__item" [title]="emoji.title" (click)="selectEmoji(emoji)">
            <img class="emoji-panel__img" [src]="emojiUrl(emoji.file)" [alt]="emoji.title" loading="lazy" />
        </button>
        }
    </div>

</div>
