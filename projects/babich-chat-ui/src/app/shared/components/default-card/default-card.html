<article
  class="default-card"
  [class.default-card--selected]="selected()"
  [class.default-card--muted]="muted()"
>
  <div class="default-card__image">
    @if (imageUrl()) {
      <img [src]="imageUrl()" [alt]="title()" />
    } @else {
      <span>{{ image() }}</span>
    }
    @if (selected()) {
      <span class="default-card__selected-mark" aria-hidden="true">✓</span>
    }
  </div>

  <h3 class="default-card__title">{{ title() }}</h3>

  <div class="default-card__body">
    <ng-content select="[card-body]">{{ body() }}</ng-content>
  </div>

  <div class="default-card__description">
    <ng-content select="[card-description]">{{ description() }}</ng-content>
  </div>

  @if (showButtons()) {
    <div class="default-card__buttons">
      <ng-content select="[card-buttons]" />
    </div>
  }
</article>
