<div class="nav-rail">
  <div class="nav-rail__section nav-rail__section--tabs">
    <button class="nav-rail__btn nav-rail__btn--home" (click)="onTabClick('home')" title="Главная">
      <span class="nav-rail__icon nav-rail__icon--home">🏠</span>
    </button>
    <button class="nav-rail__btn nav-rail__btn--settings" (click)="onTabClick('user-settings')" title="Настройки">
      <span class="nav-rail__icon nav-rail__icon--settings">⚙️</span>
    </button>
    <button class="nav-rail__btn nav-rail__btn--settings" (click)="onTabClick('info')" title="Район">
      <span class="nav-rail__icon nav-rail__icon--settings">ℹ️</span>
    </button>
    @if (isStaff()) {
      <button class="nav-rail__btn nav-rail__btn--settings" (click)="onTabClick('district-settings')" title="Настройки района">
        <span class="nav-rail__icon nav-rail__icon--settings">🛠️</span>
      </button>
    }
    <button class="nav-rail__btn nav-rail__btn--settings nav-rail__btn--notification" (click)="onTabClick('notification')" title="Уведомления">
      <span class="nav-rail__icon nav-rail__icon--settings">🔔</span>
      <app-unread-badge [count]="unreadNotifications()" size="sm" />
    </button>
  </div>

  <div class="nav-rail__divider"></div>

  <div class="nav-rail__section nav-rail__section--actions">
    <button class="nav-rail__btn" (click)="onActionClick('create')" title="Создать локацию">
      <span class="nav-rail__icon">➕</span>
    </button>
    <button class="nav-rail__btn" (click)="onActionClick('find')" title="Найти локацию">
      <span class="nav-rail__icon">🔍</span>
    </button>
    <button [disabled]="!workPageIsOpen()" class="nav-rail__btn" (click)="onActionClick('work')" title="Работать">
      <span class="nav-rail__icon">🧹</span>
    </button>
  </div>
</div>
