<!-- Пункты сгруппированы по экранам мобильных табов: район, локации, персонаж. -->
@for (section of sections(); track section.group) {
  @if (!$first) {
  <div class="nav-rail__divider"></div>
  }
  <div class="nav-rail__section">
    @for (item of section.items; track item.id) {
    <div
      class="nav-rail__item"
      [class.nav-rail__item--notification]="!!item.badge"
      [class.nav-rail__item--locked]="item.disabled?.() ?? false"
    >
      <default-button
        class="nav-rail__btn"
        [label]="''"
        [icon]="item.icon"
        [ariaLabel]="item.label"
        [attr.title]="item.label"
        type="secondary"
        size="s"
        [fullWidth]="true"
        (click)="select(item)"
      />
      @if (item.badge && item.badge() > 0) {
      <app-unread-badge [count]="item.badge()!" size="sm" />
      }
    </div>
    }
  </div>
}
