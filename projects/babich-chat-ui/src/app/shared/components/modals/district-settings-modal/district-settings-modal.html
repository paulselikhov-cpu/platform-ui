<app-window-modal title="Настройки района" (closeModal)="closeModal.emit()">
  <div class="settings-modal">

    @if (message(); as msg) {
      <div class="settings-modal__msg"
        [class.settings-modal__msg--error]="msg.kind === 'error'"
        [class.settings-modal__msg--ok]="msg.kind === 'ok'">
        {{ msg.text }}
      </div>
    }

    @if (page() === 'settings') {
      @if (loading()) {
        <div class="settings-modal__hint">Загрузка настроек...</div>
      }

      @if (form(); as f) {
        <fieldset class="settings-modal__group">
          <legend class="settings-modal__legend">Выборы губернатора</legend>

          <label class="settings-modal__row">
            <span class="settings-modal__label">Длительность, часов</span>
            <input class="settings-modal__input" type="number" min="1"
              [value]="f.electionDurationHours" (input)="setField('electionDurationHours', $event)" />
          </label>
          <label class="settings-modal__row">
            <span class="settings-modal__label">Считается живым, если заходил за (суток)</span>
            <input class="settings-modal__input" type="number" min="1"
              [value]="f.electionAliveWindowDays" (input)="setField('electionAliveWindowDays', $event)" />
          </label>
          <label class="settings-modal__row">
            <span class="settings-modal__label">Кворум, %</span>
            <input class="settings-modal__input" type="number" min="1" max="100"
              [value]="f.electionQuorumPercent" (input)="setField('electionQuorumPercent', $event)" />
          </label>
          <label class="settings-modal__row">
            <span class="settings-modal__label">Число слотов кандидатов</span>
            <input class="settings-modal__input" type="number" min="1" max="10"
              [value]="f.electionMaxCandidates" (input)="setField('electionMaxCandidates', $event)" />
          </label>
        </fieldset>

        <fieldset class="settings-modal__group">
          <legend class="settings-modal__legend">Обжаловать губернатора и запустить переизбрание</legend>

          <label class="settings-modal__row">
            <span class="settings-modal__label">Длительность, часов</span>
            <input class="settings-modal__input" type="number" min="1"
              [value]="f.recallDurationHours" (input)="setField('recallDurationHours', $event)" />
          </label>
          <label class="settings-modal__row">
            <span class="settings-modal__label">Считается живым, если заходил за (суток)</span>
            <input class="settings-modal__input" type="number" min="1"
              [value]="f.recallAliveWindowDays" (input)="setField('recallAliveWindowDays', $event)" />
          </label>
          <label class="settings-modal__row">
            <span class="settings-modal__label">Кворум, %</span>
            <input class="settings-modal__input" type="number" min="1" max="100"
              [value]="f.recallQuorumPercent" (input)="setField('recallQuorumPercent', $event)" />
          </label>
        </fieldset>

        <div class="settings-modal__footer">
          <button class="settings-modal__save" [disabled]="saving()" (click)="save()">
            {{ saving() ? 'Сохраняю...' : 'Сохранить' }}
          </button>
          @if (isAdmin() && districtId() != null) {
            <button class="settings-modal__roles" (click)="openRoles()">
              👥 Персонажи района / выдать права
            </button>
          }
        </div>
      }
    } @else {
      <div class="settings-modal__subhead">
        <button class="settings-modal__back" (click)="backToSettings()">← Назад к настройкам</button>
      </div>
      @if (districtId() != null) {
        <app-district-users-table [districtId]="districtId()!" />
      }
    }

  </div>
</app-window-modal>
