<app-window-modal title="Заявки" (closeModal)="closeModal.emit()">
  <div class="character-panel__section character-panel__applications">
    <div class="character-panel__section-title">Заявки в мэрию</div>
    @for (app of applications; track app.id) {
    <div class="character-panel__application">
      <div class="character-panel__app-title">{{ app.title }}</div>
      <div class="character-panel__app-address">{{ app.address }}</div>
      <span class="character-panel__app-status character-panel__app-status--{{ app.status }}">
        {{ app.status === 'pending' ? 'В ожидании' : app.status === 'approved' ? 'Одобрено' : 'Отклонено' }}
      </span>
    </div>
    }
  </div>
</app-window-modal>
