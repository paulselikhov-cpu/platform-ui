<!-- Меню «⋮» — действия того, что открыто. Кнопка плоская, одна и та же
     на десктопе и мобиле; размер адаптируется в styles. -->
<div class="chat-actions">
  <button
    class="chat-actions__btn"
    [class.chat-actions__btn--open]="open()"
    type="button"
    aria-label="Действия"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span class="chat-actions__icon" aria-hidden="true"></span>
  </button>
  @if (open()) {
  <div class="chat-actions__backdrop" (click)="close()"></div>
  <div class="chat-actions__menu" role="menu">
    @for (item of items(); track item.id) {
    <button
      type="button"
      role="menuitem"
      class="chat-actions__item"
      [class.chat-actions__item--danger]="item.danger"
      [class.chat-actions__item--disabled]="item.disabled"
      [disabled]="item.disabled"
      (click)="select(item)"
    >
      @if (item.icon; as icon) {
      <span class="chat-actions__icon-item" aria-hidden="true">{{ icon }}</span>
      }
      <span>{{ item.label }}</span>
    </button>
    }
  </div>
  }
  @if (pendingConfirm(); as item) {
  <app-confirm-modal [config]="item.confirm!" [loading]="confirmLoading()" (confirmed)="onConfirmed()"
    (cancelled)="onCancelled()" />
  }
</div>
