<div class="chat-actions">
  <button class="chat-actions-btn" title="Действия" (click)="toggle()">
    <span class="chat-actions-btn__star">★</span>
    <span class="chat-actions-btn__label">ДЕЙСТВИЯ</span>
  </button>
  @if (open()) {
  <div class="chat-actions-backdrop" (click)="close()"></div>
  <div class="chat-actions-menu" (click)="close()">
    <div class="chat-actions-menu__header">
      <span class="chat-actions-menu__header-star">★</span>
      МЕНЮ ДЕЙСТВИЙ
    </div>
    @for (item of items(); track item.id) {
    <button class="chat-actions-menu__item" [class.chat-actions-menu__item--danger]="item.danger"
      [class.chat-actions-menu__item--disabled]="item.disabled" [disabled]="item.disabled"
      (click)="select(item)">
      <span class="chat-actions-menu__icon">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </button>
    }
  </div>
  }
  @if (pendingConfirm(); as item) {
  <app-confirm-modal [config]="item.confirm!" [loading]="confirmLoading()" (confirmed)="onConfirmed()"
    (cancelled)="onCancelled()" />
  }
</div>
