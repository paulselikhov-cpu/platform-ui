<nav class="tab-bar" aria-label="Основная навигация">
  <default-tabs-set
    class="tab-bar__tabs"
    [tabs]="tabs()"
    [activeTab]="active() ?? ''"
    ariaLabel="Основная навигация"
    (activeTabChange)="onTabSelected($event)"
  />
  @if (unreadNotifications() > 0) {
    <app-unread-badge
      class="tab-bar__unread-badge"
      [count]="unreadNotifications()"
      size="sm"
    />
  }
</nav>
