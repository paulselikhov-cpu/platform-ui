<div class="character-panel">
  <div class="character-panel__profile-card">
    <div class="character-panel__section character-panel__avatar-section">
      <div class="character-panel__avatar">
        <span class="character-panel__avatar-letter">{{ user()?.characterName?.[0] || '?' }}</span>
      </div>
      <div class="character-panel__name">{{ user()?.characterName || 'Персонаж' }}</div>
      <div class="character-panel__username">@{{ user()?.username || 'unknown' }}</div>
    </div>

    <app-default-list class="character-panel__stats" layout="grid-compact">
      <default-stat-card label="💰 Монеты" [value]="coinBalance()" variant="warning" />
      <default-stat-card label="Уровень" [value]="userLevel()" />
      <default-stat-card label="⚡ Энергия">
        <div stat-content class="character-panel__progress-stat">
          <div class="character-panel__progress-bar">
            <div class="character-panel__progress-fill character-panel__progress-fill--energy"
                 [style.width.%]="energyPercent()"></div>
          </div>
          <span>{{ energy() }}/{{ maxEnergy }}</span>
        </div>
      </default-stat-card>
      <default-stat-card label="⭐ XP">
        <div stat-content class="character-panel__progress-stat">
          <div class="character-panel__progress-bar">
            <div class="character-panel__progress-fill character-panel__progress-fill--xp"
                 [style.width.%]="xpPercent()"></div>
          </div>
          <span>{{ xp() }}@if (xpThreshold() != null) {<span>/{{ xpThreshold() }}</span>}</span>
        </div>
      </default-stat-card>
    </app-default-list>
  </div>

  @if (showNews()) {
<div class="character-panel__section">
    <div class="character-panel__section-title">Новости района</div>
    <app-district-news-feed />
  </div>
  }
</div>
