@if (currentPage() === 'menu') {
  <div class="start-menu">
    <default-card
      class="start-menu__user-card"
      [image]="auth.currentUser()?.username?.[0]?.toUpperCase() ?? '?'"
      [title]="auth.currentUser()?.username ?? 'Профиль'"
      [body]="auth.currentUser()?.email ?? ''"
    />

    <app-default-list class="start-menu__items">
      <default-button label="Оформление" icon="🎨" (click)="currentPage.set('theme')" />
      <default-button label="Язык" icon="🌐" (click)="currentPage.set('language')" />
      <default-button
        class="settings-logout"
        label="Выйти"
        icon="🚪"
        type="danger"
        (click)="logout()"
      />
    </app-default-list>
  </div>
}

@if (currentPage() === 'theme') {
  <div class="sub-page">
    <header class="sub-page__header">
      <default-button
        class="sub-page__back"
        label="Назад"
        icon="←"
        size="s"
        [fullWidth]="false"
        (click)="goBack()"
      />
      <div class="sub-page__heading">
        <h3 class="sub-page__title">{{ pageTitles.theme }}</h3>
      </div>
    </header>

    <app-default-list class="theme-list">
      @for (t of themes; track t.id) {
        <button
          class="theme-card"
          [class.theme-card--active]="themeService.theme() === t.id"
          (click)="selectTheme(t.id)"
        >
          <span class="theme-card-label">{{ t.label }}</span>
          <span class="theme-card-desc">{{ t.desc }}</span>
        </button>
      }
    </app-default-list>
  </div>
}

@if (currentPage() === 'language') {
  <div class="sub-page">
    <header class="sub-page__header">
      <default-button
        class="sub-page__back"
        label="Назад"
        icon="←"
        size="s"
        [fullWidth]="false"
        (click)="goBack()"
      />
      <div class="sub-page__heading">
        <h3 class="sub-page__title">{{ pageTitles.language }}</h3>
      </div>
    </header>

    <app-default-list class="theme-list">
      @for (lang of languages; track lang.id) {
        <button class="theme-card theme-card--disabled" disabled>
          <span class="theme-card-label">{{ lang.label }}</span>
        </button>
      }
    </app-default-list>
  </div>
}
