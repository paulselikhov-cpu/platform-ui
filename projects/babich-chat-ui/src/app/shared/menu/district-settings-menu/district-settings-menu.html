<div class="settings-modal">
  @if (message(); as msg) {
    <div
      class="settings-modal__msg"
      [class.settings-modal__msg--error]="msg.kind === 'error'"
      [class.settings-modal__msg--ok]="msg.kind === 'ok'"
    >
      {{ msg.text }}
    </div>
  }

  @if (page() !== "menu") {
    <div class="settings-modal__subhead">
      <app-back-button (back)="backToMenu()"></app-back-button>
    </div>
  }

  @switch (page()) {
    @case ("menu") {
      @if (loading()) {
        <div class="settings-modal__hint">Загрузка настроек...</div>
      }
      <div class="settings-modal__menu">
        <default-button
          type="primary"
          label="Выборы губернатора"
          [disabled]="form() === null"
          (click)="open('election')"
        ></default-button>
        <default-button
          type="primary"
          label="Обжаловать губернатора и запустить переизбрание"
          [disabled]="form() === null"
          (click)="open('recall')"
        ></default-button>
        @if (isAdmin() && districtId() != null) {
          <default-button
            type="primary"
            label="Персонажи района"
            (click)="open('roles')"
          ></default-button>
        }
      </div>
    }

    @case ("election") {
      <app-default-table
        heading="Выборы губернатора"
        mode="vertical"
        [columns]="electionColumns"
        [items]="settingsItems()"
        [disabled]="saving()"
        (cellChange)="onCellChange($event)"
      />
      <div class="settings-modal__footer">
        <default-button
          type="success"
          [disabled]="saving()"
          (click)="save()"
          [label]="saving() ? 'Сохраняю...' : 'Сохранить'"
        ></default-button>
      </div>
    }

    @case ("recall") {
      <app-default-table
        heading="Обжаловать губернатора и запустить переизбрание"
        mode="vertical"
        [columns]="recallColumns"
        [items]="settingsItems()"
        [disabled]="saving()"
        (cellChange)="onCellChange($event)"
      />
      <div class="settings-modal__footer">
        <default-button
          type="success"
          [disabled]="saving()"
          (click)="save()"
          [label]="saving() ? 'Сохраняю...' : 'Сохранить'"
        ></default-button>
      </div>
    }

    @case ("roles") {
      @if (districtId() != null) {
        <app-district-users-table [districtId]="districtId()!" />
      }
    }
  }
</div>
