<div class="start-menu">
  <div class="settings-menu__header">
    <app-back-button [fullWidth]="false" (back)="backToMenu()"></app-back-button>
  </div>

  @switch (page()) {
    @case ("menu") {
      <default-button label="Выборы губернатора" icon="🗳️" [routerLink]="['/chat/district/info/settings/election']"
        [disabled]="form() === null"></default-button>
      <default-button label="Обжаловать губернатора и запустить переизбрание" icon="⚖️"
        [routerLink]="['/chat/district/info/settings/recall']"
        [disabled]="form() === null"></default-button>
      @if (isAdmin() && districtId() != null) {
        <default-button label="Персонажи района" icon="👥"
          [routerLink]="['/chat/district/info/settings/roles']"></default-button>
      }
    }

    @case ("election") {
      <app-default-table
        heading="Выборы губернатора"
        [columns]="electionColumns"
        [items]="settingsItems()"
        [disabled]="saving()"
        (cellChange)="onCellChange($event)"
      />
      <div class="settings-menu__footer">
        <default-button
          type="success"
          [fullWidth]="false"
          [disabled]="saving()"
          (click)="save()"
          [label]="saving() ? 'Сохраняю...' : 'Сохранить'"
        ></default-button>
      </div>
    }

    @case ("recall") {
      <app-default-table
        heading="Обжаловать губернатора и запустить переизбрание"
        [columns]="recallColumns"
        [items]="settingsItems()"
        [disabled]="saving()"
        (cellChange)="onCellChange($event)"
      />
      <div class="settings-menu__footer">
        <default-button
          type="success"
          [fullWidth]="false"
          [disabled]="saving()"
          (click)="save()"
          [label]="saving() ? 'Сохраняю...' : 'Сохранить'"
        ></default-button>
      </div>
    }

    @case ("roles") {
      @if (districtId() != null) {
        <app-district-users-table [districtId]="districtId()!" />
      }
    }
  }
</div>
