<div class="start-menu">
  @if (page() !== "menu") {
    <app-back-button (back)="backToMenu()"></app-back-button>
  }

  @switch (page()) {
    @case ("menu") {
        <default-button
          label="Выборы губернатора"
          [disabled]="form() === null"
          (click)="open('election')"
        ></default-button>
        <default-button
          label="Обжаловать губернатора и запустить переизбрание"
          [disabled]="form() === null"
          (click)="open('recall')"
        ></default-button>
        @if (isAdmin() && districtId() != null) {
          <default-button
            label="Персонажи района"
            (click)="open('roles')"
          ></default-button>
        }
    }

    @case ("election") {
      <app-default-table
        heading="Выборы губернатора"
        [columns]="electionColumns"
        [items]="settingsItems()"
        [disabled]="saving()"
        (cellChange)="onCellChange($event)"
      />
      <div class="settings-modal__footer">
        <default-button
          type="success"
          [disabled]="saving()"
          (click)="save()"
          [label]="saving() ? 'Сохраняю...' : 'Сохранить'"
        ></default-button>
      </div>
    }

    @case ("recall") {
      <app-default-table
        heading="Обжаловать губернатора и запустить переизбрание"
        [columns]="recallColumns"
        [items]="settingsItems()"
        [disabled]="saving()"
        (cellChange)="onCellChange($event)"
      />
      <div class="settings-modal__footer">
        <default-button
          type="success"
          [disabled]="saving()"
          (click)="save()"
          [label]="saving() ? 'Сохраняю...' : 'Сохранить'"
        ></default-button>
      </div>
    }

    @case ("roles") {
      @if (districtId() != null) {
        <app-district-users-table [districtId]="districtId()!" />
      }
    }
  }
</div>
