<!-- user-info.html -->
<div class="user-info-container">
    <h2>Управление пользователями</h2>

    <!-- Форма добавления пользователя -->
    <div class="add-user-form">
        <h3>Добавить пользователя</h3>
        <div class="form-group">
            <input [(ngModel)]="newUser.username" name="username" placeholder="Имя пользователя" required>
            <input [(ngModel)]="newUser.email" name="email" type="email" placeholder="Email" required>
            <input [(ngModel)]="newUser.password" name="password" type="password" placeholder="Пароль" required>
            <button (click)="addUser()">Добавить</button>
        </div>
    </div>

    <!-- Состояние загрузки -->
    <div *ngIf="loading" class="loading">
        Загрузка...
    </div>

    <!-- Ошибка -->
    <div *ngIf="error" class="error">
        {{ error }}
    </div>

    <!-- Список пользователей -->
    <div *ngIf="!loading && !error" class="users-grid">
        <div *ngFor="let user of users" class="user-card">
            <div class="user-header">
                <h3>{{ user.username }}</h3>
                <div class="user-actions">
                    <button class="delete-btn" (click)="deleteUser(user.id!, user.username)"
                        [disabled]="deletingUserId === user.id">
                        {{ deletingUserId === user.id ? 'Удаление...' : '✕' }}
                    </button>
                </div>
            </div>
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p *ngIf="user.createdAt"><strong>Создан:</strong> {{ user.createdAt | date:'dd.MM.yyyy HH:mm' }}</p>
            <p><strong>ID:</strong> {{ user.id }}</p>
        </div>
    </div>

    <!-- Если пользователей нет -->
    <div *ngIf="!loading && !error && users.length === 0" class="no-users">
        Пользователи не найдены
    </div>
</div>
